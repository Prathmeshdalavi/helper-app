name: worker_app
description: "HerExpert: the HerCare worker app (demo)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    # Figtree (SIL Open Font License, see assets/fonts/Figtree-OFL.txt).
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
          weight: 400
        - asset: assets/fonts/Figtree.ttf
          weight: 500
        - asset: assets/fonts/Figtree.ttf
          weight: 600
        - asset: assets/fonts/Figtree.ttf
          weight: 700
