name: customer_app
description: "HerCare customer app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    # Figtree (SIL Open Font License, see assets/fonts/Figtree-OFL.txt).
    # One variable file; each weight below maps to its wght axis value.
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
          weight: 400
        - asset: assets/fonts/Figtree.ttf
          weight: 500
        - asset: assets/fonts/Figtree.ttf
          weight: 600
        - asset: assets/fonts/Figtree.ttf
          weight: 700
