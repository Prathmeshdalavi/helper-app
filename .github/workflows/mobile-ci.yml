name: mobile
on:
  pull_request:
    paths: ["mobile/**"]
  push:
    branches: [main]
    paths: ["mobile/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer_app, worker_app]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
