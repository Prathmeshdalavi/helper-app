# Local development. Start Postgres/Redis with: docker compose up -d (repo root)
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/helper_app
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

management.endpoints.web.exposure.include=health,info

# DEV-ONLY secret. Never reuse outside local machines.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdef}
app.jwt.issuer=helper
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=30d
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# OTP policy. The pepper below is DEV-ONLY.
app.otp.ttl=5m
app.otp.max-attempts=5
app.otp.resend-cooldown=15s
app.otp.pepper=${OTP_PEPPER:dev-only-otp-pepper-change-me-0123456789-abcd}

# DEV-ONLY: no SMS provider is integrated yet. "log" writes the OTP to the
# application log so the flow can be exercised locally.
app.sms.provider=log
