# Local development. Start Postgres/Redis with: docker compose up -d (repo root)
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/helper_app
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

management.endpoints.web.exposure.include=health,info

# DEV-ONLY secret. Never reuse outside local machines.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdef}
app.jwt.issuer=helper
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=30d
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
