# Production: every secret/host comes from the environment, no defaults (fail fast).
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.shutdown=graceful

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

management.endpoints.web.exposure.include=health,info

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=hercare
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=30d
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.otp.ttl=5m
app.otp.max-attempts=5
app.otp.resend-cooldown=15s
app.otp.pepper=${OTP_PEPPER}

# No SMS provider is integrated yet: send-otp returns 503 until one is added.
app.sms.provider=${SMS_PROVIDER:none}
