# Used only by the DB-backed integration tests (AuthFlowIntegrationTest).
# Point TEST_DB_URL at a DEDICATED test database, never at helper_app.
spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_USER}
spring.datasource.password=${TEST_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true

app.jwt.secret=test-only-jwt-secret-0123456789-abcdef
app.jwt.issuer=helper-test
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=30d
app.cors.allowed-origins=http://localhost

app.otp.ttl=5m
app.otp.max-attempts=5
# 0s so tests can request several OTPs quickly; the cooldown itself is unit-tested.
app.otp.resend-cooldown=0s
app.otp.pepper=test-only-otp-pepper-0123456789-abcdefg
app.sms.provider=none

management.endpoint.health.show-details=never
management.health.redis.enabled=false
